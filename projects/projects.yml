# =====================================================================
#  Research projects  —  rendered by ejs/projects.ejs
#
#  Status is computed automatically from `end` (YYYY-MM):
#    end in the future or "present"  → Ongoing
#    end in the past                 → Completed
#  (evaluated at build time AND again in the visitor's browser).
#
#  Fields
#    acronym, title, url
#    funder        funding body / programme
#    start, end    "YYYY-MM" (or "YYYY"); end may be "present"
#    role          role of the MSM member in the project
#    funding       acquired third-party funding (as stated in the source)
#    kind          "project" (default) or "network" (long-term initiatives/collaborations)
#    featured      true → shown on the home page while ongoing
#
#  Source: "Projects undertaken" and "Acquired third-party funding projects"
#  in the CV in documents/msm. Projects before 05/2024 were carried out by
#  group members at previous institutions (University of Bonn, EC-JRC).
# =====================================================================

