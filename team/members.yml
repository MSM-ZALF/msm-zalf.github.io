#  Remove a person: delete their block (or move them to group "Alumni").
#
#  group  — one of (shown in this order; empty groups are hidden):
#           "Group lead" | "Senior scientists" | "Postdoctoral researchers" |
#           "PhD students" | "Research staff" | "Student assistants & interns" | "Alumni"
#  order  — sort order within a group (lower first)
#  photo  — square-ish image in assets/team/ (optional; initials are shown otherwise)
#  page   — optional profile page, e.g. team/jane-doe.qmd → "team/jane-doe.html"
#
#  Sources: ZALF working-group page (contact person) and the CV in documents/msm.
# =====================================================================

