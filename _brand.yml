# _brand.yml — Multi-Scale Modelling (MSM) · ZALF
# Quarto brand definition. Quarto reads this to generate the core Bootstrap
# theme variables (colours, fonts, links). Component styling lives in theme.scss.
# Docs: https://quarto.org/docs/authoring/brand.html
#
# ZALF institutional palette (taken from zalf.de stylesheets): white background,
# light-grey panels, ZALF greens and ZALF blue. Palette keys keep the framework's
# names (cream = page background, forest = primary green, burnt = accent …).
# Text colours meet WCAG AA contrast (≥ 4.5:1) on white and #F7F7F7.
# To align with an updated ZALF corporate design, change the values here AND
# the mirrored Sass/CSS variables at the top of theme.scss.

meta:
  name: Multi-Scale Modelling (MSM) · ZALF
  link: https://www.zalf.de/en/struktur/pb4/Pages/Arbeitsgruppen.aspx#x90x

color:
  palette:
    cream:       "#FFFFFF"   # page background
    cream-2:     "#F7F7F7"   # alternating section background
    surface:     "#FFFFFF"   # cards / raised surfaces
    ink:         "#2B2B2B"   # primary text
    ink-soft:    "#4B4B4B"   # secondary text
    ink-faint:   "#666666"   # meta / muted text (AA on white)
    forest:      "#32672F"   # ZALF dark green — primary (buttons, headings)
    forest-deep: "#1E3F1C"   # deepest green (footer, bands)
    olive:       "#637515"   # ZALF olive
    sage:        "#9FAF1F"   # ZALF lime (decorative)
    burnt:       "#4BA046"   # ZALF green — decorative accent (rings, underlines)
    burnt-text:  "#00467D"   # ZALF blue — links and accent text
    burnt-deep:  "#00365F"   # link hover
    tan:         "#CFE3A8"   # light green on dark footer
    sand:        "#EFEFEF"   # light grey

  foreground: ink
  background: cream
  primary:    forest
  secondary:  olive
  link:       burnt-text

typography:
  # Satoshi is not on Google Fonts — it is loaded via header.html (Fontshare CDN).
  base:
    family: "Open Sans"       # ZALF corporate body font
    line-height: 1.65
    size: 1rem
  headings:
    family: Satoshi           # geometric sans for headings + UI
    weight: 700
    color: ink
  monospace:
    family: "JetBrains Mono"
    size: 0.9em
  link:
    color: burnt-text
    decoration: none
